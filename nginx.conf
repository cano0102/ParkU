server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los assets con hash en el nombre (ver manualChunks en vite.config.ts) no cambian de
    # contenido una vez construidos: se pueden cachear agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA con react-router-dom (createBrowserRouter, historial HTML5): cualquier ruta que
    # no sea un archivo real (/reset-password, /forgot-password...) debe resolver a
    # index.html para que el router del lado del cliente decida qué mostrar. Sin esto,
    # recargar la página en una ruta interna da 404 de nginx en vez de la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sí cambia entre despliegues (referencia los assets con hash del build
    # actual): nunca debe quedar cacheado, o un despliegue nuevo no se vería hasta vaciar caché.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
